# Ratchet Legacy — régénère chaque nuit les pages fiches du Megacorp Vault
# (vault/*.html, vault/index.html, vault/slugs.json) et le sitemap,
# à partir de la base Supabase. Peut aussi se lancer à la main
# depuis l'onglet Actions de GitHub (« Run workflow »).
name: Pages fiches du Vault

on:
  schedule:
    - cron: '17 3 * * *'   # chaque nuit vers 4 h-5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-vault.mjs'
      - 'catalog-en.js'
      - '.github/workflows/build-vault.yml'

permissions:
  contents: write

concurrency:
  group: build-vault
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les pages
        run: node scripts/build-vault.mjs
      - name: Publier s'il y a du changement
        run: |
          git config user.name "Ratchet Legacy (auto)"
          git config user.email "ratchetlegacy@users.noreply.github.com"
          git add -A vault sitemap.xml
          # La date du sitemap change chaque jour : on ne publie que si une page a changé.
          if git diff --cached --quiet -- vault; then
            echo "Aucune fiche modifiée."
            exit 0
          fi
          git commit -m "Vault : pages fiches mises à jour"
          git push
