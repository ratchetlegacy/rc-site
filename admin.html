<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Ratchet Legacy</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0A0B14;--bg2:#10121F;--bg3:#181B2E;
  --purple:#7B4FD4;--purple-light:#9B6FF4;--orange:#FF6B1A;
  --gold:#FFC85A;--green:#3DD68C;--red:#FF4D6A;
  --text:#EEF0F8;--text-dim:#8B92AD;--text-mid:#B8BED4;--line:rgba(255,255,255,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:24px}
a{color:var(--purple-light)}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.6rem;margin-bottom:6px}
.sub{color:var(--text-dim);margin-bottom:24px;font-size:.9rem}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:14px}
label{display:block;font-size:.78rem;color:var(--text-dim);font-weight:600;margin-bottom:5px;letter-spacing:.02em}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text);font-family:Inter,sans-serif;font-size:.9rem;outline:none;margin-bottom:14px}
input:focus{border-color:var(--purple)}
.btn{border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:Inter,sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--orange));color:#fff;width:100%}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:rgba(255,77,106,.15);color:var(--red);border:1px solid rgba(255,77,106,.3);padding:6px 12px;font-size:.78rem}
.msg{padding:11px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;display:none}
.msg.ok{background:rgba(61,214,140,.12);color:var(--green);display:block}
.msg.err{background:rgba(255,77,106,.12);color:var(--red);display:block}
.guide-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.guide-row .gi{font-size:1.3rem}
.guide-row .gt{flex:1}
.guide-row .gt b{font-size:.9rem}
.guide-row .gt span{display:block;font-size:.72rem;color:var(--text-dim)}
.hidden{display:none}
.note{font-size:.78rem;color:var(--text-dim);margin-top:-6px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🔧 Admin</h1><div class="sub">Manage your site content</div></div>
    <a href="index.html" class="btn btn-ghost" style="text-decoration:none">← Site</a>
  </div>

  <!-- LOGIN -->
  <div class="card" id="login-card">
    <h2>🔐 Sign in</h2>
    <div class="msg" id="login-msg"></div>
    <label>Email</label>
    <input type="email" id="email" placeholder="ratchetlegacy@gmail.com"/>
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••"/>
    <button class="btn btn-primary" onclick="signIn()">Sign in</button>
  </div>

  <!-- GUIDES MANAGER -->
  <div id="admin-area" class="hidden">
    <div class="card">
      <h2>📗 Add a guide</h2>
      <div class="msg" id="add-msg"></div>
      <label>Title *</label>
      <input type="text" id="g-title" placeholder="e.g. Rift Apart Collection Guide"/>
      <label>Game</label>
      <input type="text" id="g-game" placeholder="e.g. Rift Apart"/>
      <label>PDF link *</label>
      <input type="text" id="g-url" placeholder="https://... (Cloudinary or a direct PDF link)"/>
      <div class="note">Upload your PDF to Cloudinary (or anywhere public) and paste the link here.</div>
      <button class="btn btn-primary" onclick="addGuide()">➕ Add guide</button>
    </div>

    <div class="card">
      <h2>📚 Existing guides</h2>
      <div id="guides-list"><div style="color:var(--text-dim);font-size:.85rem">Loading…</div></div>
    </div>

    <div class="card">
      <h2>🦊 Add / edit a character</h2>
      <div class="msg" id="char-msg"></div>
      <input type="hidden" id="c-id"/>
      <label>Name *</label>
      <input type="text" id="c-name" placeholder="e.g. Ratchet"/>
      <label>Role</label>
      <input type="text" id="c-role" placeholder="e.g. HERO · LOMBAX"/>
      <label>Description</label>
      <input type="text" id="c-desc" placeholder="Short description"/>
      <label>Photo URL (leave empty for emoji)</label>
      <input type="text" id="c-img" placeholder="https://... your figure photo"/>
      <label>Emoji (fallback if no photo)</label>
      <input type="text" id="c-emoji" placeholder="🦊"/>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" onclick="saveChar()" style="flex:1">💾 Save character</button>
        <button class="btn btn-ghost" onclick="clearCharForm()" id="c-cancel" style="display:none">Cancel</button>
      </div>
    </div>

    <div class="card">
      <h2>👥 Characters</h2>
      <div id="chars-list"><div style="color:var(--text-dim);font-size:.85rem">Loading…</div></div>
    </div>

    <div class="card">
      <h2>📦 Add / edit a catalog object</h2>
      <div class="msg" id="obj-msg"></div>
      <input type="hidden" id="o-id"/>
      <label>Name *</label>
      <input type="text" id="o-name" placeholder="e.g. Ratchet & Clank 2"/>
      <label>Category</label>
      <input type="text" id="o-category" placeholder="Game, Figure, Plush, Guide..."/>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label>Platform</label><input type="text" id="o-platform" placeholder="Playstation 2..."/></div>
        <div style="width:100px"><label>Year</label><input type="number" id="o-year" placeholder="2004"/></div>
      </div>
      <label>Photo URL</label>
      <input type="text" id="o-image" placeholder="https://res.cloudinary.com/..."/>
      <label>Description</label>
      <input type="text" id="o-desc" placeholder="Short description"/>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" onclick="saveObj()" style="flex:1">💾 Save object</button>
        <button class="btn btn-ghost" onclick="clearObjForm()" id="o-cancel" style="display:none">Cancel</button>
      </div>
    </div>

    <div class="card">
      <h2>🗃️ Catalog objects</h2>
      <input type="text" id="obj-search" placeholder="🔍 Search objects..." oninput="renderObjs()" style="margin-bottom:12px"/>
      <div id="objs-list" style="max-height:420px;overflow-y:auto"><div style="color:var(--text-dim);font-size:.85rem">Loading…</div></div>
    </div>

    <button class="btn btn-ghost" style="width:100%" onclick="signOut()">Sign out</button>
  </div>
</div>

<script>
const SB_URL='https://ihucxnmqnhevfvlamgwc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlodWN4bm1xbmhldmZ2bGFtZ3djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDQ5ODcsImV4cCI6MjA5NzI4MDk4N30.RhH778it6rcz44fdqdMLz7v-j8BWyKGGIJN4vHauhgU';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showMsg(id,txt,ok){const m=document.getElementById(id);m.textContent=txt;m.className='msg '+(ok?'ok':'err');}

async function checkSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){ showAdmin(); }
}
async function signIn(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ showMsg('login-msg',error.message,false); return; }
  showAdmin();
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }
async function loadGuides(){
  const box=document.getElementById('guides-list');
  const {data,error}=await sb.from('site_guides').select('*').order('sort_order').order('created_at');
  if(error){ box.innerHTML='<div style="color:var(--red);font-size:.85rem">'+esc(error.message)+'</div>'; return; }
  if(!data||!data.length){ box.innerHTML='<div style="color:var(--text-dim);font-size:.85rem">No guides yet.</div>'; return; }
  box.innerHTML=data.map(g=>
    `<div class="guide-row">
      <span class="gi">📗</span>
      <div class="gt"><b>${esc(g.title)}</b><span>${esc(g.game||'—')}</span></div>
      <button class="btn btn-danger" onclick="delGuide('${g.id}')">Delete</button>
    </div>`
  ).join('');
}
async function addGuide(){
  const title=document.getElementById('g-title').value.trim();
  const game=document.getElementById('g-game').value.trim();
  const url=document.getElementById('g-url').value.trim();
  if(!title||!url){ showMsg('add-msg','Title and PDF link are required.',false); return; }
  const {error}=await sb.from('site_guides').insert([{title,game:game||null,pdf_url:url}]);
  if(error){ showMsg('add-msg',error.message,false); return; }
  showMsg('add-msg','Guide added! ✓',true);
  document.getElementById('g-title').value='';
  document.getElementById('g-game').value='';
  document.getElementById('g-url').value='';
  loadGuides();
}
async function delGuide(id){
  if(!confirm('Delete this guide?')) return;
  const {error}=await sb.from('site_guides').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  loadGuides();
}
// ── Characters ──
function showAdmin(){
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('admin-area').classList.remove('hidden');
  loadGuides();
  loadChars();
  loadObjs();
}
async function loadChars(){
  const box=document.getElementById('chars-list');
  const {data,error}=await sb.from('site_characters').select('*').order('sort_order').order('name');
  if(error){ box.innerHTML='<div style="color:var(--red);font-size:.85rem">'+esc(error.message)+'</div>'; return; }
  if(!data||!data.length){ box.innerHTML='<div style="color:var(--text-dim);font-size:.85rem">No characters yet.</div>'; return; }
  box.innerHTML=data.map(c=>
    `<div class="guide-row">
      <span class="gi">${c.image_url?'🖼️':(esc(c.emoji||'🦊'))}</span>
      <div class="gt"><b>${esc(c.name)}</b><span>${esc(c.role||'—')}</span></div>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem" onclick='editChar(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button>
      <button class="btn btn-danger" onclick="delChar('${c.id}')">Delete</button>
    </div>`
  ).join('');
}
function editChar(c){
  document.getElementById('c-id').value=c.id;
  document.getElementById('c-name').value=c.name||'';
  document.getElementById('c-role').value=c.role||'';
  document.getElementById('c-desc').value=c.description||'';
  document.getElementById('c-img').value=c.image_url||'';
  document.getElementById('c-emoji').value=c.emoji||'';
  document.getElementById('c-cancel').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearCharForm(){
  ['c-id','c-name','c-role','c-desc','c-img','c-emoji'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c-cancel').style.display='none';
}
async function saveChar(){
  const id=document.getElementById('c-id').value;
  const row={
    name:document.getElementById('c-name').value.trim(),
    role:document.getElementById('c-role').value.trim()||null,
    description:document.getElementById('c-desc').value.trim()||null,
    image_url:document.getElementById('c-img').value.trim()||null,
    emoji:document.getElementById('c-emoji').value.trim()||'🦊'
  };
  if(!row.name){ showMsg('char-msg','Name is required.',false); return; }
  let error;
  if(id){ ({error}=await sb.from('site_characters').update(row).eq('id',id)); }
  else { ({error}=await sb.from('site_characters').insert([row])); }
  if(error){ showMsg('char-msg',error.message,false); return; }
  showMsg('char-msg',id?'Character updated! ✓':'Character added! ✓',true);
  clearCharForm();
  loadChars();
}
async function delChar(id){
  if(!confirm('Delete this character?')) return;
  const {error}=await sb.from('site_characters').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  loadChars();
}
// ── Catalog objects (table: catalog, same as the app) ──
let ALL_OBJS=[];
async function loadObjs(){
  const {data,error}=await sb.from('catalog').select('*').order('category').order('name');
  if(error){ document.getElementById('objs-list').innerHTML='<div style="color:var(--red);font-size:.85rem">'+esc(error.message)+'</div>'; return; }
  ALL_OBJS=data||[];
  renderObjs();
}
function renderObjs(){
  const q=(document.getElementById('obj-search').value||'').toLowerCase().trim();
  const list=ALL_OBJS.filter(o=>!q||(o.name||'').toLowerCase().includes(q));
  const box=document.getElementById('objs-list');
  if(!list.length){ box.innerHTML='<div style="color:var(--text-dim);font-size:.85rem">No object.</div>'; return; }
  box.innerHTML=list.slice(0,200).map(o=>
    `<div class="guide-row">
      <span class="gi">${o.image_url?'🖼️':'📦'}</span>
      <div class="gt"><b>${esc(o.name)}</b><span>${esc([o.category,o.platform,o.year].filter(Boolean).join(' · ')||'—')}</span></div>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem" onclick='editObj(${JSON.stringify(o).replace(/'/g,"&#39;")})'>Edit</button>
      <button class="btn btn-danger" onclick="delObj('${o.id}')">Delete</button>
    </div>`
  ).join('') + (list.length>200?'<div style="color:var(--text-dim);font-size:.75rem;text-align:center;padding:8px">Showing first 200. Use search to narrow down.</div>':'');
}
function editObj(o){
  document.getElementById('o-id').value=o.id;
  document.getElementById('o-name').value=o.name||'';
  document.getElementById('o-category').value=o.category||'';
  document.getElementById('o-platform').value=o.platform||'';
  document.getElementById('o-year').value=o.year||'';
  document.getElementById('o-image').value=o.image_url||'';
  document.getElementById('o-desc').value=o.description||'';
  document.getElementById('o-cancel').style.display='block';
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearObjForm(){
  ['o-id','o-name','o-category','o-platform','o-year','o-image','o-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('o-cancel').style.display='none';
}
async function saveObj(){
  const id=document.getElementById('o-id').value;
  const yr=document.getElementById('o-year').value;
  const row={
    name:document.getElementById('o-name').value.trim(),
    category:document.getElementById('o-category').value.trim()||null,
    platform:document.getElementById('o-platform').value.trim()||null,
    year:yr!==''?parseInt(yr):null,
    image_url:document.getElementById('o-image').value.trim()||null,
    description:document.getElementById('o-desc').value.trim()||null
  };
  if(!row.name){ showMsg('obj-msg','Name is required.',false); return; }
  let error;
  if(id){ ({error}=await sb.from('catalog').update(row).eq('id',id)); }
  else { ({error}=await sb.from('catalog').insert([row])); }
  if(error){ showMsg('obj-msg',error.message,false); return; }
  showMsg('obj-msg',id?'Object updated! ✓':'Object added! ✓',true);
  clearObjForm();
  loadObjs();
}
async function delObj(id){
  if(!confirm('Delete this object from the catalog?')) return;
  const {error}=await sb.from('catalog').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  loadObjs();
}
checkSession();
</script>
</body>
</html>
